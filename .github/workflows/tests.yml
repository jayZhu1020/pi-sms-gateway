name: Tests and Rust checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Check every tracked Rust file belongs to a build target
        run: python3 .github/scripts/check_rust_sources.py
      - name: Check Rust formatting
        run: bazel build --config=fmt //...
      - name: Lint Rust with warnings treated as errors
        run: bazel build --config=lint //...
      - name: Build all targets
        run: bazel build //...
      - name: Run all tests
        run: bazel test //... --test_output=errors
